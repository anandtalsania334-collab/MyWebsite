<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#FFC93C;
    --coral:#FF6F59;
    --sky:#3FA7D6;
    --grass:#06D6A0;
    --pop:#FF3E80;
    --cream:#FFF8EC;
    --ink:#3A2E39;
    --card:#FFFFFF;
    --shadow: 0 12px 30px rgba(58,46,57,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Quicksand', sans-serif;
    background:var(--cream);
    color:var(--ink);
    overflow:hidden;
    height:100vh;
    width:100vw;
  }
  .stage{
    height:100vh;
    width:100vw;
    position:relative;
  }
  section{
    height:100vh;
    width:100vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:absolute;
    inset:0;
    padding:32px 24px 60px;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transform: translateX(24px);
    transition: opacity .45s ease, transform .45s ease;
  }
  section.active{
    opacity:1;
    pointer-events:auto;
    transform: translateX(0);
  }
  section.exit-left{
    transform: translateX(-24px);
  }
  h1,h2,h3{
    font-family:'Fredoka', sans-serif;
    margin:0;
  }
  .eyebrow{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--pop);
    margin-bottom:10px;
  }

  /* ---------- floating shapes bg ---------- */
  .shape{
    position:absolute;
    border-radius:50%;
    opacity:.55;
    filter:blur(0px);
    animation: float 7s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0px) rotate(0deg); }
    50%{ transform: translateY(-22px) rotate(8deg); }
  }

  /* ---------- SECTION 1 : LANDING ---------- */
  #landing{
    background:
      radial-gradient(circle at 12% 15%, rgba(255,201,60,.55), transparent 42%),
      radial-gradient(circle at 88% 10%, rgba(63,167,214,.5), transparent 42%),
      radial-gradient(circle at 90% 75%, rgba(6,214,160,.4), transparent 45%),
      radial-gradient(circle at 10% 85%, rgba(255,62,128,.4), transparent 45%),
      radial-gradient(circle at 50% 45%, rgba(255,111,89,.25), transparent 55%),
      linear-gradient(160deg, #FFF6E6 0%, #FFEFF1 45%, #EAF6FF 100%);
    background-size: 140% 140%;
    animation: drift-bg 16s ease-in-out infinite alternate;
  }
  @keyframes drift-bg{
    0%{ background-position: 0% 0%; }
    100%{ background-position: 100% 100%; }
  }
  .garland{
    position:absolute;
    top:0; left:0; right:0;
    height:110px;
    pointer-events:none;
  }
  .bulb{
    position:absolute;
    top:38px;
    width:16px; height:20px;
    border-radius:50% 50% 45% 45%;
    box-shadow:0 0 14px 4px currentColor;
    animation: twinkle 1.6s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:1;}
    50%{opacity:.45;}
  }
  .title-emoji{ font-size:46px; margin-bottom:6px; display:block; }
  #landing h1{
    font-size:clamp(30px,8vw,44px);
    line-height:1.15;
    color:var(--ink);
  }
  #landing h1 span{ color:var(--pop); }
  #landing p{
    max-width:320px;
    margin:14px auto 0;
    font-size:16px;
    color:#6b5b66;
  }
  .name-tag{
    display:inline-block;
    margin-top:18px;
    padding:6px 18px;
    background:var(--card);
    border-radius:999px;
    font-weight:700;
    box-shadow:var(--shadow);
    color:var(--pop);
    font-size:14px;
    letter-spacing:.02em;
  }
  .lock-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:30px;
  }
  .lock-icon{ font-size:28px; margin-bottom:10px; }
  .pw-input{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:16px;
    text-align:center;
    letter-spacing:.15em;
    color:var(--ink);
    background:var(--card);
    border:2px solid transparent;
    border-radius:999px;
    padding:13px 22px;
    width:190px;
    box-shadow:var(--shadow);
    outline:none;
  }
  .pw-input:focus{ border-color:var(--pop); }
  .pw-error{
    color:var(--pop);
    font-weight:700;
    opacity:0;
    height:0;
    margin:0;
    overflow:hidden;
  }
  .pw-error.show{ opacity:1; height:auto; margin-top:12px; }

  /* ---------- buttons ---------- */
  .btn{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:17px;
    color:#fff;
    border:none;
    padding:16px 36px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(255,62,128,.35);
    background:linear-gradient(135deg, var(--pop), var(--coral));
    transition:transform .15s ease, box-shadow .15s ease;
    margin-top:36px;
  }
  .btn:active{ transform:scale(.95); }
  .btn.alt{
    background:linear-gradient(135deg, var(--sky), var(--grass));
    box-shadow:0 10px 24px rgba(63,167,214,.35);
  }
  .dots{
    position:absolute;
    bottom:26px;
    display:flex;
    gap:6px;
  }
  .dots span{
    width:6px;height:6px;border-radius:50%;
    background:#e6d9d0;
  }
  .dots span.active{ width:20px; border-radius:4px; background:var(--pop); }

  .btn.locked{
    opacity:.4;
    box-shadow:none;
    cursor:not-allowed;
    filter:grayscale(.4);
  }
  .btn.unlocked-pop{
    animation: pop-in .4s ease;
  }
  @keyframes pop-in{
    0%{ transform:scale(.85); }
    60%{ transform:scale(1.06); }
    100%{ transform:scale(1); }
  }
  .hint-text{
    margin-top:10px;
    font-size:12.5px;
    font-weight:700;
    color:#b7a3ae;
    letter-spacing:.02em;
    transition:opacity .3s ease;
  }
  .hint-text.done{ opacity:0; height:0; margin:0; overflow:hidden; }
  .hint-text.shake{
    animation: shake .4s ease;
    color:var(--pop);
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:-80px;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:12px 22px;
    border-radius:999px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:13.5px;
    z-index:1000;
    box-shadow:0 10px 26px rgba(0,0,0,.25);
    transition: bottom .35s cubic-bezier(.3,.6,.3,1);
  }
  .toast.show{ bottom:34px; }

  .music-toggle{
    position:fixed;
    top:18px;
    right:18px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.85);
    box-shadow:var(--shadow);
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1001;
    cursor:pointer;
  }
  .music-toggle:active{ transform:scale(.92); }
  .music-toggle.needs-tap{
    animation: music-pulse 1s ease-in-out infinite;
  }
  @keyframes music-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,62,128,.5); }
    50%{ box-shadow:0 0 0 8px rgba(255,62,128,0); }
  }

  /* ---------- SECTION 2: CAKE ---------- */
  #cake-sec{
    background:
      radial-gradient(circle at 85% 80%, rgba(6,214,160,.45), transparent 45%),
      radial-gradient(circle at 15% 15%, rgba(255,201,60,.5), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(255,111,89,.35), transparent 45%),
      radial-gradient(circle at 10% 85%, rgba(63,167,214,.35), transparent 45%),
      linear-gradient(160deg, #FFF7E9 0%, #FFF2EC 50%, #E9FFF6 100%);
    background-size: 140% 140%;
    animation: drift-bg 18s ease-in-out infinite alternate;
  }
  .cake-wrap{
    position:relative;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .cake-stage{
    position:relative;
    width:220px;
    height:180px;
  }
  .cake-half{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    transition: transform .5s cubic-bezier(.3,.6,.3,1), filter .5s ease;
  }
  .cake-half .cake{ width:220px; display:block; }
  .half-left{ clip-path: inset(0 50% 0 0); }
  .half-right{ clip-path: inset(0 0 0 50%); }
  .cake-wrap.cut .half-left{ transform: translate(-16px, 3px) rotate(-5deg); }
  .cake-wrap.cut .half-right{ transform: translate(16px, 3px) rotate(5deg); }
  .knife-line{
    position:absolute;
    top:4%; bottom:8%;
    left:50%;
    width:0px;
    background:#fff;
    box-shadow:0 0 10px 2px rgba(255,255,255,.9);
    transform:translateX(-50%);
    opacity:0;
    border-radius:2px;
  }
  .cake-wrap.cut .knife-line{
    animation: slice .45s ease forwards;
  }
  @keyframes slice{
    0%{ width:0px; opacity:1; }
    60%{ width:4px; opacity:1; }
    100%{ width:4px; opacity:0; }
  }
  .flame{
    transform-origin:center bottom;
    animation: flicker 1s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{ transform:scaleY(1) rotate(-2deg); }
    50%{ transform:scaleY(1.15) rotate(2deg); }
  }
  .cake-wrap.blown .flame{ opacity:0; }
  .tap-hint{
    margin-top:18px;
    font-size:14px;
    font-weight:600;
    color:#8a7a85;
    transition:opacity .3s ease;
  }
  .tap-hint.done{ opacity:0; height:0; margin:0; overflow:hidden; }
  .cake-label{
    font-family:'Fredoka', sans-serif;
    font-size:22px;
    font-weight:600;
    color:var(--ink);
    margin-top:26px;
    opacity:0;
    transform:translateY(6px);
    transition: opacity .4s ease, transform .4s ease;
  }
  .cake-label.show{ opacity:1; transform:translateY(0); }
  #cakeHint{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    opacity:0;
    height:0;
    margin:0;
    overflow:hidden;
  }
  #cakeHint.show{
    opacity:1;
    height:auto;
    margin-top:10px;
  }
  #cakeHint .swipe-icon{
    display:inline-block;
    animation: swipe-move 1.3s ease-in-out infinite;
  }
  @keyframes swipe-move{
    0%,100%{ transform:translateX(0); }
    50%{ transform:translateX(10px); }
  }
  #cake-sec h2{ font-size:clamp(24px,7vw,32px); }
  #cake-sec .sub{ margin:8px 0 22px; color:#6b5b66; font-size:15px; }

  /* ---------- SECTION 3: FLIP CARDS ---------- */
  #wishes-sec{
    background:
      radial-gradient(circle at 88% 20%, rgba(255,111,89,.45), transparent 45%),
      radial-gradient(circle at 8% 80%, rgba(63,167,214,.45), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(255,62,128,.3), transparent 45%),
      radial-gradient(circle at 15% 15%, rgba(6,214,160,.3), transparent 45%),
      linear-gradient(160deg, #FFF1EC 0%, #FDF0FF 50%, #EAF6FF 100%);
    background-size: 140% 140%;
    animation: drift-bg 17s ease-in-out infinite alternate;
  }
  .wish-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:100%;
    max-width:360px;
    margin-top:26px;
  }
  .flip-card{
    perspective:1000px;
    height:150px;
  }
  .flip-inner{
    position:relative;
    width:100%; height:100%;
    transition: transform .6s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-inner{ transform: rotateY(180deg); }
  .flip-front, .flip-back{
    position:absolute; inset:0;
    border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    backface-visibility:hidden;
    box-shadow:var(--shadow);
    padding:12px;
  }
  .flip-front{
    background:var(--card);
    font-size:34px;
  }
  .flip-front small{
    font-size:11px;
    font-weight:700;
    color:#b7abb2;
    margin-top:6px;
    letter-spacing:.05em;
  }
  .flip-back{
    background:linear-gradient(160deg, var(--pop), var(--coral));
    color:#fff;
    transform: rotateY(180deg);
    font-size:12.5px;
    line-height:1.45;
    font-weight:600;
    overflow-y:auto;
  }
  .flip-card:nth-child(2) .flip-back{ background:linear-gradient(160deg, var(--sky), #2d8fc1); }
  .flip-card:nth-child(3) .flip-back{ background:linear-gradient(160deg, var(--grass), #04a682); }
  .flip-card:nth-child(4) .flip-back{ background:linear-gradient(160deg, var(--sun), #e0a300); }

  /* ---------- SECTION 4: LETTER ---------- */
  #letter-sec{
    background:
      radial-gradient(circle at 50% 0%, rgba(255,201,60,.5), transparent 50%),
      radial-gradient(circle at 90% 90%, rgba(255,62,128,.35), transparent 45%),
      radial-gradient(circle at 5% 85%, rgba(63,167,214,.3), transparent 45%),
      linear-gradient(160deg, #FFF7E4 0%, #FFEFDD 50%, #FFF1F4 100%);
    background-size: 140% 140%;
    animation: drift-bg 19s ease-in-out infinite alternate;
  }
  .letter-card{
    background:var(--card);
    border-radius:22px;
    box-shadow:var(--shadow);
    max-width:340px;
    width:100%;
    padding:30px 26px 26px;
    text-align:left;
  }
  .letter-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px;
  }
  .letter-head .dotrow{ display:flex; gap:5px; }
  .letter-head .dotrow span{ width:9px;height:9px;border-radius:50%; }
  .letter-head .dotrow span:nth-child(1){ background:var(--coral); }
  .letter-head .dotrow span:nth-child(2){ background:var(--sun); }
  .letter-head .dotrow span:nth-child(3){ background:var(--grass); }
  .letter-head .fname{ font-size:11px; font-weight:700; letter-spacing:.05em; color:#b7abb2; }
  .letter-card h3{
    font-size:26px;
    color:var(--pop);
    margin-bottom:14px;
  }
  .letter-card p{
    font-size:14.5px;
    line-height:1.7;
    margin:0 0 14px;
    color:#4a3d47;
  }
  .letter-card p b{ color:var(--pop); font-family:'Fredoka',sans-serif; }
  .sign{
    font-family:'Fredoka', sans-serif;
    font-size:22px;
    color:var(--coral);
    margin-top:6px;
  }
  .signed-by{ font-size:12px; color:#9a8b95; margin-top:2px; }

  .confetti-piece{
    position:fixed;
    top:-10px;
    width:9px; height:14px;
    z-index:999;
    pointer-events:none;
    border-radius:2px;
  }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- SECTION 1: LANDING -->
  <section id="landing">
    <div class="garland">
      <div class="bulb" style="left:10%; color:var(--coral); animation-delay:.1s;"></div>
      <div class="bulb" style="left:22%; color:var(--sun); animation-delay:.4s;"></div>
      <div class="bulb" style="left:34%; color:var(--sky); animation-delay:.2s;"></div>
      <div class="bulb" style="left:46%; color:var(--pop); animation-delay:.6s;"></div>
      <div class="bulb" style="left:58%; color:var(--grass); animation-delay:.3s;"></div>
      <div class="bulb" style="left:70%; color:var(--sun); animation-delay:.5s;"></div>
      <div class="bulb" style="left:82%; color:var(--coral); animation-delay:.15s;"></div>
      <div class="bulb" style="left:92%; color:var(--sky); animation-delay:.35s;"></div>
    </div>
    <span class="title-emoji">🎉🎂</span>
    <div class="eyebrow">celebration mode</div>
    <h1>It's <span>Princess's</span><br>Birthday!</h1>
    <p>A tiny corner of the internet just for you, made with all my love (and way too many emojis).</p>
    <div class="name-tag">To the world's best sister 💗</div>
    <div class="lock-wrap">
      <div class="lock-icon">🔒</div>
      <input type="password" id="pwInput" inputmode="numeric" autocomplete="off" placeholder="Enter password" class="pw-input" onkeydown="if(event.key==='Enter') tryUnlock();" />
      <button class="btn" id="unlockBtn" onclick="tryUnlock()">Unlock 🔓</button>
      <div class="hint-text pw-error" id="pwError">Incorrect password, try again</div>
    </div>
    <div class="dots">
      <span class="active"></span><span></span><span></span><span></span>
    </div>
  </section>

  <!-- SECTION 2: CAKE -->
  <section id="cake-sec"></section>

  <!-- SECTION 3: FLIP CARDS -->
  <section id="wishes-sec"></section>

  <!-- SECTION 4: LETTER -->
  <section id="letter-sec"></section>

</div>

<div class="toast" id="toast"></div>

function b64ToBuf(b64){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return buf;
}

async function decryptPayload(password){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: b64ToBuf(ENC.salt), iterations: ENC.iterations, hash:'SHA-256' },
    keyMaterial, { name:'AES-GCM', length:256 }, false, ['decrypt']
  );
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64ToBuf(ENC.iv)}, key, b64ToBuf(ENC.ct));
  return new TextDecoder().decode(pt);
}

async function tryUnlock(){
  const pwField = document.getElementById('pwInput');
  const btn = document.getElementById('unlockBtn');
  const err = document.getElementById('pwError');
  const pw = pwField.value.trim();
  if(!pw) return;
  primeAudio(); // must happen synchronously inside the tap, before any await
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'Unlocking...';
  try{
    const plaintext = await decryptPayload(pw);
    const data = JSON.parse(plaintext);
    document.getElementById('cake-sec').innerHTML = data.cake;
    document.getElementById('wishes-sec').innerHTML = data.wishes;
    document.getElementById('letter-sec').innerHTML = data.letter;
    unlocked['cake-sec'] = true;
    attachCakeListeners();
    err.classList.remove('show');
    showStep(idxOf('cake-sec'));
    startBirthdayMusic();
  }catch(e){
    err.classList.remove('shake');
    void err.offsetWidth;
    err.classList.add('show','shake');
    btn.disabled = false;
    btn.textContent = originalText;
    pwField.value = '';
    pwField.focus();
  }
}

const order = ['landing','cake-sec','wishes-sec','letter-sec'];
let unlocked = { 'landing':true, 'cake-sec':false, 'wishes-sec':false, 'letter-sec':false };
let flippedCount = 0;
let currentIdx = 0;
let candlesBlown = false;
let cakeCut = false;

function idxOf(id){ return order.indexOf(id); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}

function showStep(idx){
  const currentEl = document.getElementById(order[currentIdx]);
  const nextEl = document.getElementById(order[idx]);
  if(currentEl !== nextEl){
    currentEl.classList.remove('active');
    currentEl.classList.add('exit-left');
    nextEl.classList.remove('exit-left');
    // force reflow so the transition plays from the right starting point
    void nextEl.offsetWidth;
    nextEl.classList.add('active');
    setTimeout(()=>currentEl.classList.remove('exit-left'), 500);
  }
  currentIdx = idx;
}

function goTo(id){
  if(!unlocked[id]){
    if(id==='letter-sec'){
      showToast('Flip all 4 cards first 💌');
      pulseHint('wishHint');
    }
    return;
  }
  showStep(idxOf(id));
}

function pulseHint(hintId){
  const h = document.getElementById(hintId);
  if(!h) return;
  h.classList.remove('shake');
  void h.offsetWidth;
  h.classList.add('shake');
}

function unlockSection(id, btnId, hintId){
  unlocked[id] = true;
  const btn = btnId ? document.getElementById(btnId) : null;
  const hint = hintId ? document.getElementById(hintId) : null;
  if(btn){ btn.classList.remove('locked'); btn.classList.add('unlocked-pop'); }
  if(hint){ hint.classList.add('done'); }
}

function restartAll(){
  // wipe the decrypted content back out and re-lock behind the password
  document.getElementById('cake-sec').innerHTML = '';
  document.getElementById('wishes-sec').innerHTML = '';
  document.getElementById('letter-sec').innerHTML = '';

  flippedCount = 0;
  candlesBlown = false;
  cakeCut = false;
  unlocked['cake-sec'] = false;
  unlocked['wishes-sec'] = false;
  unlocked['letter-sec'] = false;

  stopBirthdayMusic();
  const musicBtn = document.getElementById('musicToggle');
  if(musicBtn){ musicBtn.style.display = 'none'; musicBtn.classList.remove('needs-tap'); }

  const pwField = document.getElementById('pwInput');
  const pwErr = document.getElementById('pwError');
  const unlockBtn = document.getElementById('unlockBtn');
  if(pwField) pwField.value = '';
  if(pwErr) pwErr.classList.remove('show');
  if(unlockBtn){ unlockBtn.disabled = false; unlockBtn.textContent = 'Unlock 🔓'; }

  showStep(0);
}

function blowCandles(){
  if(candlesBlown) return;
  candlesBlown = true;
  const wrap = document.getElementById('cakeWrap');
  wrap.classList.add('blown');
  burstConfetti();
  document.getElementById('tapHint').classList.add('done');
  document.getElementById('cakeLabel').classList.add('show');
  document.getElementById('cakeHint').classList.add('show');
}

function cutCake(){
  if(!candlesBlown || cakeCut) return;
  cakeCut = true;
  const wrap = document.getElementById('cakeWrap');
  wrap.classList.add('cut');
  burstConfetti();
  document.getElementById('cakeHint').classList.add('done');
  unlocked['wishes-sec'] = true;
  setTimeout(()=>{
    showStep(idxOf('wishes-sec'));
  }, 650);
}

/* ---- background music: your uploaded song, looped ---- */
/* Embedded directly in the page as a data URI (self-contained, no
   external file to lose). Starts on unlock and loops until the page
   is closed, muted, or restarted — audio always stops the instant
   the tab/page closes.
   Mobile browsers only allow audio.play() to succeed when it runs
   synchronously inside a user tap; since unlocking involves an
   async decrypt step first, primeAudio() does a silent play+pause
   the instant the Unlock button is tapped (before any await) to
   "unlock" playback for this element, so the real play() call after
   decryption succeeds even though it's no longer directly in the
   tap handler. */
let musicPlaying = false;
let audioPrimed = false;

function getMusicEl(){
  return document.getElementById('bgMusic');
}

function primeAudio(){
  if(audioPrimed) return;
  const el = getMusicEl();
  if(!el) return;
  const p = el.play();
  if(p && p.then){
    p.then(()=>{ el.pause(); el.currentTime = 0; audioPrimed = true; }).catch(()=>{});
  }
}

function startBirthdayMusic(){
  const el = getMusicEl();
  if(!el) return;
  el.currentTime = 0;
  const btn = document.getElementById('musicToggle');
  btn.style.display = 'flex';
  const playPromise = el.play();
  if(playPromise && playPromise.then){
    playPromise.then(()=>{
      musicPlaying = true;
      btn.textContent = '🔊';
    }).catch(()=>{
      // autoplay still blocked on this browser: show a tappable
      // prompt so one tap on the speaker icon starts the music
      musicPlaying = false;
      btn.textContent = '🔈';
      btn.classList.add('needs-tap');
      showToast('Tap 🔈 to start the music');
    });
  } else {
    musicPlaying = true;
    btn.textContent = '🔊';
  }
}

function stopBirthdayMusic(){
  const el = getMusicEl();
  if(el){ el.pause(); el.currentTime = 0; }
  musicPlaying = false;
}

function toggleMusic(){
  const el = getMusicEl();
  const btn = document.getElementById('musicToggle');
  if(!el) return;
  btn.classList.remove('needs-tap');
  if(musicPlaying){
    el.pause();
    musicPlaying = false;
    btn.textContent = '🔇';
  } else {
    el.play().then(()=>{
      musicPlaying = true;
      btn.textContent = '🔊';
    }).catch(()=>{});
  }
}

/* ---- cake interactions: tap to blow, swipe to cut ---- */
/* Uses touch + mouse events directly (more reliable across mobile
   browsers than Pointer Events alone) with a simple start->end
   gesture check instead of continuous move tracking.
   Called after the cake markup is injected post-unlock, since the
   element doesn't exist in the DOM before the password is entered. */
let gestureStartX = 0, gestureStartY = 0, gestureActive = false;

function gestureStart(x, y){
  gestureActive = true;
  gestureStartX = x;
  gestureStartY = y;
}

function gestureEnd(x, y){
  if(!gestureActive) return;
  gestureActive = false;
  const dx = x - gestureStartX;
  const dy = y - gestureStartY;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if(candlesBlown && !cakeCut){
    // any reasonably horizontal drag counts as a swipe-to-cut
    if(Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)){
      cutCake();
    }
  } else if(!candlesBlown){
    // small movement / plain tap blows out the candles
    if(dist < 14){
      blowCandles();
    }
  }
}

function attachCakeListeners(){
  const cakeWrapEl = document.getElementById('cakeWrap');
  if(!cakeWrapEl || cakeWrapEl.dataset.bound) return;
  cakeWrapEl.dataset.bound = 'true';

  // Touch (primary path for phones)
  cakeWrapEl.addEventListener('touchstart', e=>{
    const t = e.changedTouches[0];
    gestureStart(t.clientX, t.clientY);
  }, { passive:true });

  cakeWrapEl.addEventListener('touchend', e=>{
    const t = e.changedTouches[0];
    gestureEnd(t.clientX, t.clientY);
  }, { passive:true });

  cakeWrapEl.addEventListener('touchcancel', ()=>{ gestureActive = false; }, { passive:true });

  // Mouse (desktop / trackpad fallback)
  cakeWrapEl.addEventListener('mousedown', e=>{
    gestureStart(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', e=>{
    if(gestureActive) gestureEnd(e.clientX, e.clientY);
  });
}

function handleFlip(card){
  const wasFlipped = card.classList.contains('flipped');
  card.classList.toggle('flipped');
  if(!wasFlipped){
    flippedCount++;
    if(flippedCount >= 4){
      unlockSection('letter-sec','letterBtn','wishHint');
    }
  }
}

function burstConfetti(){
  const colors = ['#FF6F59','#FFC93C','#3FA7D6','#06D6A0','#FF3E80'];
  for(let i=0;i<50;i++){
    const el = document.createElement('div');
    el.className='confetti-piece';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    const duration = 1800 + Math.random()*1200;
    const drift = (Math.random()-0.5)*200;
    el.animate([
      { transform: `translate(0,0) rotate(0deg)`, opacity:1 },
      { transform: `translate(${drift}px, 100vh) rotate(${360+Math.random()*360}deg)`, opacity:1 }
    ], { duration, easing:'cubic-bezier(.2,.6,.4,1)' });
    setTimeout(()=>el.remove(), duration+50);
  }
}

document.getElementById('landing').classList.add('active');
</script>
